# ssh bruteforce
type: leaky
name: ssh-slow-bad-keyexchange-bf
description: "Detect ssh bad key exchange"
filter: "evt.Meta.log_type == 'ssh_bad_keyexchange'"
leakspeed: "10s"
references:
  - http://wikipedia.com/ssh-bf-is-bad
capacity: 1
groupby: evt.Meta.source_ip
blackhole: 1m
reprocess: true
labels:
  service: ssh
  behavior: "ssh:bruteforce"
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1110
  remediation: true
  label: "SSH Slow Bad Key Bruteforce"
