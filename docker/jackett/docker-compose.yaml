version: '3.4'

services:
  jackett:
    image: linuxserver/jackett:latest
    container_name: jackett
    environment:
      # 当前用户的 uid 和 gid，可以在终端运行 id 来查看，大部分时候都是 1000
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_UPDATE=true #optional
    volumes:
      - ./data:/config
      - ./blackhole:/downloads
    # ports:
    #   - 9117:9117
    restart: unless-stopped
    networks:
      - frontend
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.jackett.rule=Host(`tr.example.com`)"
      - "traefik.http.routers.jackett.entrypoints=srv"
      - "traefik.http.routers.jackett.tls.certresolver=cloudflare"
      - "traefik.http.services.jackett.loadbalancer.server.port=9117"

# flaresolverr 服务，用来跳过某些站点的人机验证
  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - backend

networks:
  frontend:
    external: true
  backend:
    external: true
